# Steuert Netlify. Kein Build: der Ordner public/ wird ausgeliefert, wie er im Repo liegt.
# Geschrieben von scripts/veroeffentlichung.py --einrichten (Projekt "Claude Chatbot Workflow") - nicht von Hand aendern.

[build]
  publish = "public"

[build.processing]
  skip_processing = true

# Kein Skript, keine Fremdquellen: Stil steht in jeder Seite, Bilder und Schriften nur von hier.
# Suchmaschinen: noch die alte Website - alle Seiten noindex per Kopfzeile (bis --einrichten).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex"
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
